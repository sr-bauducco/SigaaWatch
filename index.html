<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SigaaWatch ⏱️</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans p-4">
    <div class="max-w-md mx-auto">
        <h1 class="text-3xl font-extrabold text-center text-blue-700 mb-2">SigaaWatch</h1>
        <p class="text-sm text-center text-gray-500 mb-6" id="status">Buscando dados no servidor...</p>
        
        <div id="materias-container" class="space-y-4"></div>
    </div>

    <script>
        async function carregarFaltas() {
            try {
                // O '?t=' evita que o telemóvel guarde dados velhos em cache
                const response = await fetch('dados_faltas.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error('Ficheiro JSON não encontrado.');
                
                const dados = await response.json();
                const container = document.getElementById('materias-container');
                container.innerHTML = ''; 
                
                document.getElementById('status').innerText = 'Sincronizado via Oracle Cloud ☁️';

                for (const [materia, info] of Object.entries(dados)) {
                    // Limpar strings caso tenham vindo com texto ("10 horas" -> 10)
                    const faltas = parseInt(info.faltas) || 0;
                    const limite = parseInt(info.limite) || 1; 
                    const porcentagem = (faltas / limite) * 100;
                    
                    // Lógica de cores para a barra de perigo
                    let corBarra = 'bg-emerald-500';
                    if (porcentagem > 50) corBarra = 'bg-amber-400';
                    if (porcentagem > 80) corBarra = 'bg-red-500';

                    const card = `
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
                            <h2 class="text-md font-bold text-gray-800 truncate mb-1" title="${materia}">${materia}</h2>
                            <div class="flex justify-between text-sm text-gray-600 mb-2">
                                <span>Faltas: <strong class="text-gray-900">${faltas}</strong></span>
                                <span>Limite: <strong class="text-gray-900">${limite}</strong></span>
                            </div>
                            <div class="w-full bg-gray-100 rounded-full h-2.5">
                                <div class="${corBarra} h-2.5 rounded-full transition-all duration-500" style="width: ${Math.min(porcentagem, 100)}%"></div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += card;
                }
            } catch (error) {
                document.getElementById('status').innerText = '⚠️ O ficheiro de faltas ainda não foi gerado pelo robô.';
                console.error(error);
            }
        }

        carregarFaltas();
    </script>
</body>
</html>
