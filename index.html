<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SigaaWatch ⏱️</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans p-4">
    <div class="max-w-md mx-auto">
        <h1 class="text-3xl font-extrabold text-center text-blue-700 mb-2">SigaaWatch</h1>
        <p class="text-sm text-center text-gray-500 mb-6" id="status">Sincronizando...</p>
        
        <div id="materias-container" class="space-y-4"></div>
    </div>

    <script>
        async function carregarFaltas() {
            try {
                // Busca o arquivo JSON com um timestamp para evitar cache de dados velhos
                const response = await fetch('dados_faltas.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error('Arquivo de faltas não encontrado.');
                
                const dados = await response.json();
                const container = document.getElementById('materias-container');
                container.innerHTML = ''; // Limpa o container antes de adicionar
                
                document.getElementById('status').innerText = 'Sincronizado via Oracle Cloud ☁️';

                // CORREÇÃO AQUI: Iterando corretamente sobre cada matéria e seus dados
                for (const [materiaNome, info] of Object.entries(dados)) {
                    
                    // Converte os dados para números garantindo que não haja erro
                    const faltas = parseInt(info.faltas) || 0;
                    const limite = parseInt(info.limite) || 1; // Evita divisão por zero
                    const porcentagem = (faltas / limite) * 100;
                    
                    // Define a cor da barra com base no perigo de reprovação
                    let corBarra = 'bg-emerald-500'; // Seguro (Verde)
                    if (porcentagem > 50) corBarra = 'bg-amber-400'; // Atenção (Amarelo)
                    if (porcentagem > 80) corBarra = 'bg-red-500'; // Perigo (Vermelho)

                    // Cria o HTML do card, agora usando materiaNome corretamente
                    const card = `
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
                            <h2 class="text-md font-bold text-gray-800 truncate mb-1" title="${materiaNome}">
                                ${materiaNome}
                            </h2>
                            
                            <div class="flex justify-between text-sm text-gray-600 mb-2">
                                <span>Faltas: <strong class="text-gray-900">${faltas}</strong></span>
                                <span>Limite: <strong class="text-gray-900">${limite}</strong></span>
                                <span class="text-xs font-mono text-gray-400">${Math.round(porcentagem)}%</span>
                            </div>
                            
                            <div class="w-full bg-gray-100 rounded-full h-2.5">
                                <div class="${corBarra} h-2.5 rounded-full transition-all duration-500" style="width: ${Math.min(porcentagem, 100)}%"></div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += card;
                }
            } catch (error) {
                // Se der erro, avisa o usuário
                document.getElementById('status').innerText = '⚠️ Erro ao carregar os dados de faltas.';
                console.error('Erro detalhado:', error);
            }
        }

        // Executa a função assim que a página abre
        carregarFaltas();
    </script>
</body>
</html>
